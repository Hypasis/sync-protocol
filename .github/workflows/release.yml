name: Automated Release & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Package Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Cross-compile Go binaries
        run: |
          mkdir -p build/dist
          GOOS=linux GOARCH=amd64 go build -o build/dist/hypasis-sync-linux-amd64 ./cmd/hypasis-sync
          GOOS=linux GOARCH=arm64 go build -o build/dist/hypasis-sync-linux-arm64 ./cmd/hypasis-sync
          GOOS=darwin GOARCH=amd64 go build -o build/dist/hypasis-sync-darwin-amd64 ./cmd/hypasis-sync
          GOOS=darwin GOARCH=arm64 go build -o build/dist/hypasis-sync-darwin-arm64 ./cmd/hypasis-sync
          cd build/dist && tar -czvf hypasis-sync-${{ github.ref_name }}-linux-amd64.tar.gz hypasis-sync-linux-amd64
          cd build/dist && tar -czvf hypasis-sync-${{ github.ref_name }}-linux-arm64.tar.gz hypasis-sync-linux-arm64
          cd build/dist && tar -czvf hypasis-sync-${{ github.ref_name }}-darwin-amd64.tar.gz hypasis-sync-darwin-amd64
          cd build/dist && tar -czvf hypasis-sync-${{ github.ref_name }}-darwin-arm64.tar.gz hypasis-sync-darwin-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
